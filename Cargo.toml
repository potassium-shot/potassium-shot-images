[package]
name = "potassium-shot-images"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-anyhow = "0.11.13"
dashmap = { version = "6.2.1", features = ["serde"] }
image = "0.25.10"
parse_duration = "2.1.1"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.0", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.29.0", features = ["serde", "v4"] }
